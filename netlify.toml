# Netlify deployment — the frontend is a Vite SPA living in ./frontend.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Vite 6 + Tailwind CSS v4 require Node 20+.
[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
